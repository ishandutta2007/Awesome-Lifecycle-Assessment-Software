<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b09b" />
      <stop offset="50%" stop-color="#96c93d" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#80d8ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px #00e676); }
      100% { transform: scale(1); opacity: 0.8; }
    }
    @keyframes rotateCycle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes textShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) opacity(0.3); }
      50% { transform: translateY(-15px) opacity(0.8); }
      100% { transform: translateY(0px) opacity(0.3); }
    }
    .cycle-icon {
      transform-origin: 150px 200px;
      animation: rotateCycle 25s linear infinite;
    }
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      fill: url(#accentGrad);
      filter: drop-shadow(0 2px 8px rgba(0,230,118,0.3));
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 400;
      fill: #e0e0e0;
      letter-spacing: 1.5px;
    }
    .badge-pill {
      animation: pulse 4s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Grid / Nodes Overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Animated Floating Particles -->
  <circle cx="250" cy="90" r="4" fill="#00e676" class="particle" style="animation-delay: 0s;" />
  <circle cx="950" cy="120" r="6" fill="#96c93d" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="1080" cy="280" r="5" fill="#00b09b" class="particle" style="animation-delay: 3s;" />
  <circle cx="180" cy="310" r="3" fill="#ffffff" class="particle" style="animation-delay: 2s;" />

  <!-- Animated LCA Cycle / Eco Emblem (Left Side) -->
  <g class="cycle-icon">
    <!-- Outer Ring -->
    <circle cx="150" cy="200" r="75" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="15 10" />
    <!-- Inner Leaf / Recycled Arrows -->
    <path d="M150,140 C175,140 195,160 195,185 C195,210 170,230 150,250 C130,230 105,210 105,185 C105,160 125,140 150,140 Z" fill="url(#accentGrad)" opacity="0.85" />
    <circle cx="150" cy="185" r="18" fill="#0f2027" />
    <path d="M145,175 L158,185 L145,195 Z" fill="#00e676" />
  </g>

  <!-- Main Banner Text & Badges (Right Side) -->
  <g transform="translate(260, 0)">
    <!-- Top Category Tag -->
    <g class="badge-pill" transform="translate(0, 75)">
      <rect width="280" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2" stroke="#00e676" stroke-width="1.5" />
      <text x="140" y="21" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#00e676" text-anchor="middle" letter-spacing="1">🌱 SUSTAINABILITY &amp; LCA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="title-text" font-size="44">Awesome Lifecycle Assessment</text>
    <text x="0" y="205" class="title-text" font-size="44" fill="#ffffff">Software &amp; Tools ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="255" class="subtitle-text" font-size="18">Curated SaaS Platforms • Open-Source Frameworks • EPD &amp; PCF Calculators</text>

    <!-- Highlight Metrics Pill Bar -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="38" rx="8" fill="#142834" stroke="#00b09b" stroke-width="1" />
      <text x="85" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#a0e0d0" text-anchor="middle">🏢 Top Enterprise SaaS</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="38" rx="8" fill="#142834" stroke="#96c93d" stroke-width="1" />
      <text x="275" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c5e1a5" text-anchor="middle">🐍 Brightway &amp; openLCA</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="190" height="38" rx="8" fill="#142834" stroke="#00e676" stroke-width="1" />
      <text x="475" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#b9f6ca" text-anchor="middle">📊 ISO 14040/44 Compliant</text>
    </g>
  </g>
</svg>
